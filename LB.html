<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>兰博基尼-官方网站</title>
    <link rel="stylesheet" href="./LB.css">
    <link rel="icon" href="./image/navIcon.png">
</head>

<body>
    <header class="head">
        <nav>
            <img src="./image/navIcon.png">
            <ul class="headCar">
                <li><a>车型</a></li>
                <li><a>BEYOND</a></li>
                <li><a>车主服务</a></li>
                <li><a>赛车运动</a></li>
            </ul>

            <ul class="product">
                <li><a>经销商</a></li>
                <li><a>博物馆</a></li>
                <li><a>商店</a></li>
            </ul>
            <div class="search ">
                <img src="./image/header/icon1.png" alt="">
                <img src="./image//header/icon2.png" alt="">
                <img src="./image//header//icon3.png" alt="">
            </div>

            <div class="line"></div>
        </nav>
    </header>

    <!-- 中心区域 -->
    <div class="center">
        <div class="s1">
            <div class="showName">
                <p>Models</p>
                <p>Aventador</p>
            </div>
        </div>

        <div class="s2">
            <video src="./video/sp4.mp4" controls="true" autoplay="autoplay" muted="muted" loop></video>
        </div>

        <!-- 导航点 -->
        <span class="swiper">
            <div class="active"></div>
            <div></div>
        </span>
    </div>



    <!-- 车子预览区 -->
    <div class="findCar">
        <div class="black"></div>
        <div class="switchBox">
            <div>车型</div>
            <div class="switch">
                <div>&lt;</div>
                <div>&gt;</div>
            </div>
        </div>
        <div class="parallelogram car1"></div>
        <div class="parallelogram car2"></div>
        <div class="parallelogram car3"></div>
    </div>



    <script src="./LB.js"></script>
</body>

</html>
